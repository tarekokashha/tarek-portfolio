name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56.1 cannot
    # install browser dependencies on. Bump both together.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The site itself has no dependencies; Playwright is only needed to
      # drive the verification harness.
      - name: Install Playwright
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: Build
        run: node build.mjs

      - name: Verify
        run: node scripts/check.mjs
